<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>تطبيق استخراج PDF | زجاج سائل</title>
  <!-- PDF-Lib -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Font Awesome 6 (مجاني) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* reset شامل */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #b8e1fc 0%, #d0bfff 70%, #a5f0ea 100%);
      background-size: 200% 200%;
      animation: liquidBreathing 18s infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      position: relative;
      overflow-x: hidden;
      direction: rtl;
    }

    /* فقاعات خلفية متحركة - تأثير سائل عميق */
    body::before {
      content: '';
      position: fixed;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.5) 0%, transparent 30%),
                  radial-gradient(circle at 80% 70%, rgba(230,245,255,0.7) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(210,240,250,0.6) 0%, transparent 50%);
      filter: blur(50px);
      animation: rotateBlob 25s infinite alternate ease-in-out;
      z-index: 0;
    }

    @keyframes liquidBreathing {
      0% { background-position: 0% 30%; }
      100% { background-position: 100% 70%; }
    }

    @keyframes rotateBlob {
      0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
      100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
    }

    /* حاوية التطبيق الرئيسية - تحاكي شاشة الهاتف */
    .app-container {
      position: relative;
      z-index: 30;
      width: 100%;
      max-width: 400px; /* عرض مثالي للهاتف */
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-radius: 48px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 30px 80px rgba(0, 30, 40, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
      padding: 28px 20px 30px;
      transition: transform 0.2s;
      color: #043b47;
      overflow: hidden;
    }

    /* شريط الحالة العلوي (مثل التطبيقات) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px 20px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      text-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .status-bar i {
      font-size: 1.2rem;
      filter: drop-shadow(0 2px 4px rgba(0,30,30,0.3));
    }
    .time {
      background: rgba(255,255,255,0.2);
      padding: 4px 16px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.5);
    }

    /* العنوان الرئيسي مع أيقونة */
    .app-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding: 0 6px;
    }
    .app-icon {
      background: rgba(255,255,255,0.3);
      border-radius: 30px;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      box-shadow: 0 15px 25px rgba(0,70,80,0.2);
    }
    .app-icon i {
      font-size: 3.2rem;
      color: white;
      filter: drop-shadow(0 5px 8px #024f5e);
    }
    .app-title {
      flex: 1;
    }
    .app-title h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-shadow: 0 3px 10px rgba(255,255,255,0.5);
    }
    .app-title p {
      font-size: 0.9rem;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    /* بطاقة رفع الملف */
    .upload-card {
      background: rgba(255,255,255,0.25);
      border-radius: 38px;
      padding: 18px 18px 22px;
      margin-bottom: 22px;
      border: 1.5px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 25px -8px rgba(0,60,70,0.2);
    }

    .upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.2);
      border-radius: 32px;
      border: 2.5px dashed rgba(255,255,255,0.9);
      padding: 32px 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 16px;
    }
    .upload-area:hover {
      background: rgba(255,255,255,0.35);
      border-color: white;
    }
    .upload-area i {
      font-size: 3.5rem;
      color: white;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 10px #01505e);
    }
    .upload-area span {
      font-size: 1.4rem;
      font-weight: 600;
      color: #01333d;
    }
    .upload-area small {
      font-size: 1rem;
      opacity: 0.7;
    }
    #pdfInput {
      display: none;
    }

    /* تفاصيل الملف */
    .file-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.3);
      border-radius: 34px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(5px);
    }
    .file-icon {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .file-icon i {
      font-size: 1.8rem;
      color: #024f61;
    }
    .file-icon .file-name {
      font-weight: 600;
      font-size: 1.1rem;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-count {
      background: rgba(0,90,100,0.3);
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 700;
      border: 1px solid white;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* حقل إدخال الصفحات - تصميم جذاب */
    .range-section {
      margin: 28px 0 25px;
    }
    .range-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 8px;
      font-weight: 600;
      font-size: 1.2rem;
    }
    .range-box {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .page-input-wrapper {
      flex: 1;
      background: rgba(255,255,255,0.3);
      border-radius: 40px;
      border: 2px solid rgba(255,255,255,0.8);
      padding: 8px 0;
      backdrop-filter: blur(5px);
      box-shadow: 0 5px 15px rgba(0,30,30,0.1);
    }
    .page-input-wrapper label {
      display: block;
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 5px;
    }
    .page-input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      text-align: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #012e38;
      outline: none;
      padding: 0 5px;
    }
    .page-input-wrapper input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .range-sep {
      font-size: 2.5rem;
      font-weight: 300;
      color: white;
      text-shadow: 0 4px 8px #01505e;
    }

    /* زر الاستخراج الرئيسي */
    .extract-btn {
      background: linear-gradient(135deg, #ffffff70, #e6ffff80);
      border: none;
      border-radius: 50px;
      padding: 24px 20px;
      width: 100%;
      font-size: 2.2rem;
      font-weight: 700;
      color: #00323f;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 40px -10px #024f5e60, 0 0 0 2px rgba(255,255,255,0.7) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid white;
      margin: 8px 0 18px;
      touch-action: manipulation;
    }
    .extract-btn:active {
      transform: scale(0.97);
      background: linear-gradient(135deg, #ffffffb0, #d6fbfb);
      box-shadow: 0 15px 25px #02445270;
    }
    .extract-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(100%);
    }

    /* منطقة رابط التحميل المباشر - تصميم بطاقة */
    .download-area {
      background: rgba(255,255,255,0.2);
      border-radius: 44px;
      padding: 20px;
      margin: 18px 0 12px;
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: 0.2s;
    }
    .download-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .download-info i {
      font-size: 2.2rem;
      color: #015764;
    }
    .download-info span {
      font-weight: 600;
      font-size: 1.1rem;
    }
    .download-link {
      background: white;
      border-radius: 40px;
      padding: 14px 24px;
      color: #015764;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 20px rgba(0,70,70,0.2);
      border: 1px solid white;
      transition: 0.15s;
    }
    .download-link:active {
      transform: scale(0.94);
      background: #e3f5f5;
    }
    .hidden {
      display: none !important;
    }

    /* رسائل الحالة */
    .status-message {
      background: rgba(255,255,255,0.2);
      border-radius: 50px;
      padding: 16px 20px;
      margin: 12px 0 5px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      backdrop-filter: blur(6px);
      border: 1px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* tabbar سفلي (شريط تطبيق) */
    .app-tabbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 25px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: white;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .tab-item.active {
      opacity: 1;
      font-weight: 600;
    }
    .tab-item i {
      font-size: 1.5rem;
    }

    /* تحسينات للمس */
    button, .upload-area, .download-link {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- شريط حالة سفلي علوي -->
    <div class="status-bar">
      <i class="fas fa-signal"></i>
      <span class="time">9:41</span>
      <i class="fas fa-battery-three-quarters"></i>
    </div>

    <!-- الهيدر مع أيقونة التطبيق -->
    <div class="app-header">
      <div class="app-icon">
        <i class="fas fa-file-pdf"></i>
      </div>
      <div class="app-title">
        <h1>مستخرج PDF</h1>
        <p><i class="fas fa-droplet"></i> زجاج سائل · خصوصية كاملة</p>
      </div>
    </div>

    <!-- بطاقة اختيار الملف -->
    <div class="upload-card">
      <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt"></i>
        <span id="uploadBtnText">اختر ملف PDF</span>
        <small>أو اضغط للتصفح</small>
        <input type="file" id="pdfInput" accept=".pdf" />
      </div>

      <!-- تفاصيل الملف المختار -->
      <div class="file-details" id="fileDetails">
        <div class="file-icon">
          <i class="fas fa-file-pdf"></i>
          <span class="file-name" id="fileNameDisplay">لم يتم اختيار ملف</span>
        </div>
        <div class="page-count" id="pageCountDisplay">
          <i class="fas fa-copy"></i>
          <span id="pageCountValue">0</span>
        </div>
      </div>
    </div>

    <!-- اختيار نطاق الصفحات -->
    <div class="range-section">
      <div class="range-label">
        <span><i class="fas fa-arrow-left"></i> الأولى</span>
        <span><i class="fas fa-arrow-right"></i> الأخيرة</span>
      </div>
      <div class="range-box">
        <div class="page-input-wrapper">
          <input type="number" id="firstPage" min="1" value="1" placeholder="1">
          <label>من</label>
        </div>
        <div class="range-sep"><i class="fas fa-ellipsis-h"></i></div>
        <div class="page-input-wrapper">
          <input type="number" id="lastPage" min="1" value="1" placeholder="1">
          <label>إلى</label>
        </div>
      </div>
    </div>

    <!-- زر الاستخراج الرئيسي -->
    <button class="extract-btn" id="extractBtn" disabled>
      <i class="fas fa-cut"></i>
      <span>استخرج</span>
      <i class="fas fa-download"></i>
    </button>

    <!-- رابط التحميل المباشر (يظهر بعد الاستخراج) -->
    <div id="downloadContainer" class="download-area hidden">
      <div class="download-info">
        <i class="fas fa-file-export"></i>
        <span>الملف جاهز</span>
      </div>
      <a href="#" id="downloadLink" class="download-link" download>
        <i class="fas fa-download"></i> تحميل
      </a>
    </div>

    <!-- رسائل الحالة -->
    <div class="status-message" id="statusMsg">
      <i class="fas fa-hand-pointer" id="statusIcon"></i>
      <span id="statusText">اختر ملف PDF للبدء</span>
    </div>

    <!-- شريط سفلي (تبويب وهمي) -->
    <div class="app-tabbar">
      <div class="tab-item active">
        <i class="fas fa-home"></i>
        <span>الرئيسية</span>
      </div>
      <div class="tab-item">
        <i class="fas fa-history"></i>
        <span>المستخرجة</span>
      </div>
      <div class="tab-item">
        <i class="fas fa-user"></i>
        <span>الملف</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const { PDFDocument } = PDFLib;

      // عناصر DOM
      const pdfInput = document.getElementById('pdfInput');
      const uploadArea = document.getElementById('uploadArea');
      const uploadBtnText = document.getElementById('uploadBtnText');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const pageCountValue = document.getElementById('pageCountValue');
      const firstPageInput = document.getElementById('firstPage');
      const lastPageInput = document.getElementById('lastPage');
      const extractBtn = document.getElementById('extractBtn');
      const downloadContainer = document.getElementById('downloadContainer');
      const downloadLink = document.getElementById('downloadLink');
      const statusIcon = document.getElementById('statusIcon');
      const statusText = document.getElementById('statusText');

      // متغيرات الحالة
      let sourcePdfDoc = null;
      let totalPages = 0;
      let currentFileName = '';
      let lastExtractedBlobUrl = null; // لتخزين رابط التحميل الحالي

      // دالة تحديث الحالة
      function setStatus(message, icon = 'fa-hand-pointer', isError = false) {
        statusText.innerText = message;
        statusIcon.className = `fas ${icon}`;
        if (isError) {
          statusIcon.style.color = '#c04a4a';
        } else {
          statusIcon.style.color = '';
        }
      }

      // إظهار أو إخفاء رابط التحميل
      function showDownloadLink(blobUrl, fileName) {
        if (blobUrl) {
          downloadLink.href = blobUrl;
          downloadLink.download = fileName; // تعيين اسم الملف
          downloadContainer.classList.remove('hidden');
        } else {
          downloadContainer.classList.add('hidden');
        }
      }

      // تنظيف أي رابط سابق
      function revokeLastUrl() {
        if (lastExtractedBlobUrl) {
          URL.revokeObjectURL(lastExtractedBlobUrl);
          lastExtractedBlobUrl = null;
        }
      }

      // تحديث واجهة بعد تحميل ملف
      function refreshUiAfterLoad() {
        if (sourcePdfDoc && totalPages > 0) {
          firstPageInput.max = totalPages;
          lastPageInput.max = totalPages;

          let firstVal = parseInt(firstPageInput.value);
          let lastVal = parseInt(lastPageInput.value);

          if (isNaN(firstVal) || firstVal < 1) firstPageInput.value = 1;
          if (isNaN(lastVal) || lastVal < 1) lastPageInput.value = totalPages;

          if (parseInt(firstPageInput.value) > totalPages) firstPageInput.value = totalPages;
          if (parseInt(lastPageInput.value) > totalPages) lastPageInput.value = totalPages;

          extractBtn.disabled = false;
          setStatus('الملف جاهز، حدد الصفحات', 'fa-check-circle');
        } else {
          extractBtn.disabled = true;
        }
      }

      // معالجة اختيار الملف
      pdfInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) {
          // لا يوجد ملف
          sourcePdfDoc = null;
          totalPages = 0;
          fileNameDisplay.innerText = 'لم يتم اختيار ملف';
          pageCountValue.innerText = '0';
          uploadBtnText.innerHTML = 'اختر ملف PDF';
          extractBtn.disabled = true;
          showDownloadLink(null);
          setStatus('اختر ملف PDF للبدء', 'fa-hand-pointer');
          return;
        }

        // عرض اسم الملف
        currentFileName = file.name;
        fileNameDisplay.innerText = currentFileName.length > 25 ? currentFileName.substring(0,22)+'…' : currentFileName;
        uploadBtnText.innerHTML = 'تغيير الملف';
        setStatus('جاري تحميل PDF...', 'fa-spinner fa-pulse');
        showDownloadLink(null); // إخفاء رابط التحميل السابق
        revokeLastUrl(); // تنظيف

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await PDFDocument.load(arrayBuffer, {
            ignoreEncryption: true,
            throwOnInvalidObject: false,
          });

          const pagesCount = pdfDoc.getPageCount();
          sourcePdfDoc = pdfDoc;
          totalPages = pagesCount;
          pageCountValue.innerText = pagesCount;

          refreshUiAfterLoad();
        } catch (error) {
          console.error('خطأ في قراءة PDF:', error);
          sourcePdfDoc = null;
          totalPages = 0;
          fileNameDisplay.innerText = 'فشل التحميل';
          pageCountValue.innerText = '0';
          extractBtn.disabled = true;
          setStatus('الملف غير مدعوم أو تالف', 'fa-exclamation-triangle', true);
        }
      });

      // النقر على منطقة الرفع
      uploadArea.addEventListener('click', () => pdfInput.click());

      // التحقق من صحة المدخلات قبل الاستخراج
      function getValidatedRange() {
        if (!sourcePdfDoc || totalPages === 0) {
          setStatus('الرجاء اختيار ملف PDF أولاً', 'fa-exclamation-circle', true);
          return null;
        }

        const firstRaw = firstPageInput.value.trim();
        const lastRaw = lastPageInput.value.trim();

        if (firstRaw === '' || lastRaw === '') {
          setStatus('أدخل رقم الصفحة الأولى والأخيرة', 'fa-exclamation-circle', true);
          return null;
        }

        const first = Number(firstRaw);
        const last = Number(lastRaw);

        if (!Number.isInteger(first) || !Number.isInteger(last) || first < 1 || last < 1) {
          setStatus('الأرقام يجب أن تكون أعداداً صحيحة موجبة', 'fa-exclamation-circle', true);
          return null;
        }

        if (first > totalPages || last > totalPages) {
          setStatus(`النطاق يتجاوز عدد الصفحات (${totalPages})`, 'fa-exclamation-circle', true);
          return null;
        }

        if (first > last) {
          setStatus('الصفحة الأولى أكبر من الأخيرة', 'fa-exclamation-circle', true);
          return null;
        }

        return { first, last };
      }

      // حدث استخراج الصفحات
      extractBtn.addEventListener('click', async function() {
        const range = getValidatedRange();
        if (!range) return;

        const { first, last } = range;

        try {
          extractBtn.disabled = true;
          setStatus('جاري استخراج الصفحات...', 'fa-spinner fa-pulse');
          showDownloadLink(null); // إخفاء أي رابط سابق
          revokeLastUrl();

          // إنشاء مستند جديد
          const newPdf = await PDFDocument.create();
          const indices = [];
          for (let i = first; i <= last; i++) indices.push(i - 1);

          const copiedPages = await newPdf.copyPages(sourcePdfDoc, indices);
          copiedPages.forEach(page => newPdf.addPage(page));

          const pdfBytes = await newPdf.save();
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });
          const url = URL.createObjectURL(blob);
          lastExtractedBlobUrl = url;

          // إنشاء اسم ملف للتحميل
          const baseName = currentFileName.replace('.pdf', '') || 'مستخرج';
          const downloadName = `${baseName}_صفحات_${first}_الى_${last}.pdf`;

          // عرض رابط التحميل
          showDownloadLink(url, downloadName);

          // محاولة التحميل المباشر أيضًا (اختياري) – نقوم بالتحميل التلقائي مرة واحدة.
          // لكننا نعطي المستخدم رابطاً للضغط عليه متى شاء.
          // سنقوم أيضاً بعمل تحميل تلقائي (اختياري) لتحسين التجربة، يمكن فتح الرابط.
          // نقوم بإنشاء رابط وهمي وتنزيله تلقائياً (كما في السابق) ليكون فورياً.
          const a = document.createElement('a');
          a.href = url;
          a.download = downloadName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          setStatus(`تم تجهيز الصفحات ${first}-${last}`, 'fa-circle-check');
        } catch (error) {
          console.error('فشل الاستخراج:', error);
          setStatus('حدث خطأ أثناء الاستخراج', 'fa-bug', true);
        } finally {
          if (sourcePdfDoc && totalPages > 0) {
            extractBtn.disabled = false;
          }
        }
      });

      // عند فقدان التركيز على حقول الإدخال نتحقق من النطاق
      firstPageInput.addEventListener('blur', function() {
        if (!sourcePdfDoc || totalPages === 0) return;
        let val = parseInt(firstPageInput.value);
        if (isNaN(val) || val < 1) firstPageInput.value = 1;
        else if (val > totalPages) firstPageInput.value = totalPages;
      });

      lastPageInput.addEventListener('blur', function() {
        if (!sourcePdfDoc || totalPages === 0) return;
        let val = parseInt(lastPageInput.value);
        if (isNaN(val) || val < 1) lastPageInput.value = totalPages;
        else if (val > totalPages) lastPageInput.value = totalPages;
      });

      // تعطيل الزر في البداية
      extractBtn.disabled = true;

      // تنظيف عند إعادة تحميل الصفحة (اختياري)
      window.addEventListener('beforeunload', function() {
        revokeLastUrl();
      });
    })();
  </script>
</body>
</html>
